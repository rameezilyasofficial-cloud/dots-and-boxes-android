plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fixtocode.dotsandboxes'
    compileSdk 34

    signingConfigs {
        fixedKey {
            storeFile file("fixed_debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.fixtocode.dotsandboxes"
        minSdk 26
        targetSdk 34
        // Auto-increments on every build so Android always installs as an UPDATE!
        versionCode = (int) (System.currentTimeMillis() / 60000L)
        versionName "1.1"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixedKey
        }
        release {
            signingConfig signingConfigs.fixedKey
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'com.unity3d.ads:unity-ads:4.12.2'
}